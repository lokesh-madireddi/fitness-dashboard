<!DOCTYPE html>
<html>
<head>
    <title>Fitness Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="text-center mb-4">🏋️ Daily Fitness Dashboard</h2>

<form method="POST" class="card p-3 mb-4">
    <div class="row mb-3">
        <div class="col">
            <input type="number" name="steps" class="form-control" placeholder="Steps" required>
        </div>
        <div class="col">
            <input type="text" name="workout" class="form-control" placeholder="Workout (Gym / Run)">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col">
            <input type="number" name="calories" class="form-control" placeholder="Calories Burned">
        </div>
        <div class="col">
            <input type="number" step="0.1" name="weight" class="form-control" placeholder="Weight (kg)">
        </div>
    </div>

    <textarea name="notes" class="form-control mb-3" placeholder="Notes"></textarea>

    <button class="btn btn-primary w-100">Save Today's Fitness</button>
</form>

<h4>📊 History</h4>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Date</th>
            <th>Steps</th>
            <th>Workout</th>
            <th>Calories</th>
            <th>Weight</th>
            <th>Notes</th>
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[6] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
